# Виртуальный хост для сераямышь.рф.
#
# Ставится ПОСЛЕ выпуска сертификата — блоки ниже слушают 443 и ссылаются на
# файлы из /etc/letsencrypt, без них nginx не стартует. Порядок целиком:
#
#   1. seraya-mysh-bootstrap.conf  → nginx -t && systemctl reload nginx
#   2. sudo certbot certonly --webroot -w /var/www/certbot \
#        -d xn--80apaghdkxi3f.xn--p1ai -d www.xn--80apaghdkxi3f.xn--p1ai
#   3. sudo cp deploy/nginx/seraya-mysh.conf /etc/nginx/sites-available/seraya-mysh
#      sudo nginx -t && sudo systemctl reload nginx
#
# Используется `certonly --webroot`, а не `--nginx`: плагин nginx правит конфиги
# сам и требует, чтобы вся конфигурация сервера была ему понятна — на сервере с
# восемью чужими виртуальными хостами это лишний риск. Здесь всё написано явно.
#
# Имя домена записано в punycode: часть инструментов не принимает unicode.
# xn--80apaghdkxi3f.xn--p1ai == сераямышь.рф
#
# HTTP/2 включается параметром `listen ... http2`, а не отдельной директивой
# `http2 on`: последняя появилась только в nginx 1.25.1, а на сервере 1.24.0 —
# она там вызывает `unknown directive "http2"` и `nginx -t` не проходит.
# Старая форма понятна обеим веткам (в 1.25+ она объявлена устаревшей, но
# работает), поэтому конфиг остаётся переносимым.
#
# Оговорка старой формы: параметры протокола берутся из первого server-блока,
# занявшего сокет :443. Если другой виртуальный хост объявлен раньше без http2,
# nginx предупредит `protocol options redefined` и HTTP/2 не включится — тогда
# http2 нужно дописать и в тот хост либо обновить nginx до 1.25.1+.

server {
    listen 80;
    listen [::]:80;
    server_name xn--80apaghdkxi3f.xn--p1ai www.xn--80apaghdkxi3f.xn--p1ai;

    # Продление сертификата: certbot кладёт файл проверки в этот каталог.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--80apaghdkxi3f.xn--p1ai$request_uri;
    }
}

# www → без www, чтобы не плодить дубли в поиске.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xn--80apaghdkxi3f.xn--p1ai;

    # Сертификат один на оба имени: имя каталога — первый домен из certbot -d.
    ssl_certificate     /etc/letsencrypt/live/xn--80apaghdkxi3f.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80apaghdkxi3f.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://xn--80apaghdkxi3f.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80apaghdkxi3f.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80apaghdkxi3f.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80apaghdkxi3f.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/seraya-mysh.access.log;
    error_log  /var/log/nginx/seraya-mysh.error.log;

    # Медиафайлы и видео заметно крупнее среднего запроса.
    client_max_body_size 32m;

    # Приложение само отдаёт HSTS, Referrer-Policy, X-Frame-Options и остальное
    # (next.config.mjs), поэтому здесь заголовки не дублируются.

    # Ответы Next уже сжаты не всегда — включаем gzip для текстовых типов.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # Неизменяемые ассеты Next: длинный кэш, минуя приложение при повторных заходах.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For нужен: по нему считается лимит отправки формы.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Загрузка крупных файлов в админке не должна обрываться по таймауту.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
