# Виртуальный хост для сераямышь.рф.
#
# Установка:
#   sudo cp deploy/nginx/seraya-mysh.conf /etc/nginx/sites-available/seraya-mysh
#   sudo ln -s /etc/nginx/sites-available/seraya-mysh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат выпускается ПОСЛЕ первого включения этого файла (см. docs/deployment.md):
#   sudo certbot --nginx -d xn--80apaghdkxi3f.xn--p1ai -d www.xn--80apaghdkxi3f.xn--p1ai
# certbot сам допишет строки ssl_certificate и блок редиректа с 80 на 443.
#
# Имя домена записано в punycode: часть инструментов не принимает unicode.
# xn--80apaghdkxi3f.xn--p1ai == сераямышь.рф

server {
    listen 80;
    listen [::]:80;
    server_name xn--80apaghdkxi3f.xn--p1ai www.xn--80apaghdkxi3f.xn--p1ai;

    # Проверка владения доменом для Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://xn--80apaghdkxi3f.xn--p1ai$request_uri;
    }
}

# www → без www, чтобы не плодить дубли в поиске.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--80apaghdkxi3f.xn--p1ai;

    # ssl_certificate / ssl_certificate_key допишет certbot

    return 301 https://xn--80apaghdkxi3f.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--80apaghdkxi3f.xn--p1ai;

    # ssl_certificate / ssl_certificate_key допишет certbot

    access_log /var/log/nginx/seraya-mysh.access.log;
    error_log  /var/log/nginx/seraya-mysh.error.log;

    # Медиафайлы и видео заметно крупнее среднего запроса.
    client_max_body_size 32m;

    # Приложение само отдаёт HSTS, Referrer-Policy, X-Frame-Options и остальное
    # (next.config.mjs), поэтому здесь заголовки не дублируются.

    # Ответы Next уже сжаты не всегда — включаем gzip для текстовых типов.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    # Неизменяемые ассеты Next: длинный кэш, минуя приложение при повторных заходах.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For нужен: по нему считается лимит отправки формы.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Загрузка крупных файлов в админке не должна обрываться по таймауту.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
