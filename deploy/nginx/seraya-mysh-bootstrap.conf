# Временный виртуальный хост: нужен только чтобы выпустить первый сертификат.
#
# Полный конфиг (seraya-mysh.conf) слушает 443 и ссылается на файлы сертификата.
# Пока их нет, nginx не запускается вообще:
#   [emerg] no "ssl_certificate" is defined for the "listen ... ssl" directive
# Поэтому порядок такой: сначала этот файл → выпуск сертификата → полный конфиг.
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx/seraya-mysh-bootstrap.conf /etc/nginx/sites-available/seraya-mysh
#   sudo ln -s /etc/nginx/sites-available/seraya-mysh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# xn--80apaghdkxi3f.xn--p1ai == сераямышь.рф (punycode: часть инструментов
# не принимает unicode).

server {
    listen 80;
    listen [::]:80;
    server_name xn--80apaghdkxi3f.xn--p1ai www.xn--80apaghdkxi3f.xn--p1ai;

    # Проверка владения доменом для Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Сайт по HTTP не отдаём: он должен открываться только по HTTPS,
    # а редиректа пока некуда — сертификата ещё нет.
    location / {
        return 404;
    }
}
