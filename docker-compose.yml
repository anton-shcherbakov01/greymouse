services:
  postgres:
    image: postgres:16-alpine
    container_name: greymouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greymouse
      POSTGRES_PASSWORD: greymouse
      POSTGRES_DB: greymouse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greymouse -d greymouse']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Локальный S3-совместимый storage для проверки production-конфигурации uploads.
  # Не обязателен для обычной разработки: без S3_BUCKET Payload пишет в файловую систему.
  minio:
    image: minio/minio:latest
    container_name: greymouse-minio
    restart: unless-stopped
    profiles: ['storage']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: greymouse
      MINIO_ROOT_PASSWORD: greymouse-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
